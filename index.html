<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu galletita de la suerte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="tarjeta">

        <!-- Flores decorativas -->
        <span class="flor flor-rosa">✿</span>
        <span class="flor flor-amarilla">✿</span>
        <span class="flor flor-morada">✿</span>
        <span class="flor flor-naranja">✿</span>

        <span class="flor flor-rosa-2">✿</span>
        <span class="flor flor-amarilla-2">✿</span>
        <span class="flor flor-morada-2">✿</span>
        <span class="flor flor-naranja-2">✿</span>

        <!-- Hojas decorativas -->
        <span class="hoja hoja-1">🌿</span>
        <span class="hoja hoja-2">🌿</span>
        <span class="hoja hoja-3">🌿</span>
        <span class="hoja hoja-4">🌿</span>
        <span class="hoja hoja-5">🌿</span>
        <span class="hoja hoja-6">🌿</span>

        <!-- Puntos decorativos -->
        <span class="punto punto-1"></span>
        <span class="punto punto-2"></span>
        <span class="punto punto-3"></span>
        <span class="punto punto-4"></span>

        <!-- Encabezado -->
        <section class="encabezado">
            <h1>Tu galletita<br>de la suerte</h1>

            <p class="subtitulo">
                Un pequeño mensaje<br>
                para un gran día
            </p>
        </section>

        <!-- Imagen real de la galletita -->
        <div class="galleta">
            <img
                src="imagenes/galletita-sin-fondo.png"
                alt="Galletita de la suerte"
            >
        </div>

        <!-- Mensaje automático -->
        <section class="mensaje-contenedor">
            <p id="fecha"></p>

            <p id="frase">
                Cargando tu mensaje...
            </p>

            <div class="separador">
                ♥
            </div>
        </section>

        <!-- Texto inferior -->
        <p class="frase-inferior">
            Que la suerte te acompañe ♡
        </p>

        <p class="despedida">
            Un pequeño detalle,<br>
            una gran sonrisa. 💕
        </p>

    </main>

    <script src="script.js"></script>
</body>
</html>
